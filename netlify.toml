[build]
  command = "rm -rf .next && npx prisma generate && npm run build"

[build.environment]
  NETLIFY_USE_YARN = "false"
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max_old_space_size=4096"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  included_files = ["prisma/**"]
  external_node_modules = ["@prisma/client", "prisma"]

# Scheduled Function cadence is defined inline in each function's exported
# `config.schedule`. Keeping one source of truth avoids duplicate/conflicting
# schedules between netlify.toml and function code.

# ─── Required Environment Variables ─────────────────────────────────────────
# Set production values in Netlify → Site configuration → Environment variables.
# Never commit secret values.
#
# Core authentication / database:
#   DATABASE_URL          Neon PostgreSQL application connection string
#   AUTH_URL              https://www.edumeetup.com
#   NEXTAUTH_URL          https://www.edumeetup.com (temporary compatibility alias used by magic-link wrapper)
#   AUTH_SECRET           Stable NextAuth v5 production secret
#   GOOGLE_CLIENT_ID      Google OAuth client ID
#   GOOGLE_CLIENT_SECRET  Google OAuth client secret
#   NEXT_PUBLIC_APP_URL   https://www.edumeetup.com
#
# Email / operations:
#   EMAIL_FROM
#   RESEND_API_KEY
#   SUPPORT_EMAIL
#   NEXT_PUBLIC_SUPPORT_EMAIL
#   ADMIN_NOTIFICATION_EMAIL
#
# Meetings / payments:
#   WHEREBY_API_KEY
#   RAZORPAY_KEY_ID
#   RAZORPAY_KEY_SECRET
#   RAZORPAY_WEBHOOK_SECRET
#   NEXT_PUBLIC_RAZORPAY_KEY_ID
#   CIRCUIT_PRICE_INR     Optional override in paise, not rupees
#
# Bot protection:
#   NEXT_PUBLIC_TURNSTILE_SITE_KEY
#   TURNSTILE_SECRET_KEY
#
# AI / quotas (when enabled):
#   GROQ_API_KEY
#   ANTHROPIC_API_KEY
#   UPSTASH_REDIS_REST_URL
#   UPSTASH_REDIS_REST_TOKEN
#
# Storage:
#   R2_ACCOUNT_ID
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET
#   R2_PUBLIC_URL
#
# Monitoring:
#   NEXT_PUBLIC_SENTRY_DSN
#   NEXT_PUBLIC_APP_ENV   production
#   SENTRY_AUTH_TOKEN
#
# HTTP cron/API routes:
#   CRON_SECRET           Shared secret for routes that explicitly authenticate it.
#                         Native Netlify Scheduled Functions themselves MUST NOT
#                         require a custom incoming cron header.
#
# Database migrations:
#   DIRECT_URL            GitHub Actions secret, not a Netlify runtime requirement.
#                         Used by .github/workflows/migrate.yml.
#
# WhatsApp (when activated):
#   WHATSAPP_TOKEN
#   WHATSAPP_PHONE_ID

# --- Security Headers ---------------------------------------------------------
# Content-Security-Policy is intentionally NOT set here. next.config.mjs is the
# single source of truth for CSP because the app requires third-party origins for
# Turnstile, Razorpay, Wati, Sentry and Whereby. Sending a second CSP from Netlify
# would intersect with the Next.js policy and can silently block those features.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Opener-Policy = "same-origin"
