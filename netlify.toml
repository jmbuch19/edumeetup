[build]
  command = "rm -rf .next && npx prisma generate && npm run build"

[build.environment]
  NETLIFY_USE_YARN = "false"
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max_old_space_size=4096"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  # Include Prisma schema/runtime assets needed by server functions.
  included_files = ["prisma/**"]
  # Keep Prisma engines as node modules rather than rebundling them with esbuild.
  external_node_modules = ["@prisma/client", "prisma"]

[functions."process-deletions"]
  schedule = "0 2 * * *"

# Hourly agent — student + university + fair triggers
[functions."agent"]
  schedule = "0 * * * *"

# Every 15 min — fair-auto-live + fair-auto-complete
[functions."fair-fast-agent"]
  schedule = "*/15 * * * *"

# Every 15 min — group session reminders (24h and 30min before)
[functions."session-reminders"]
  schedule = "*/15 * * * *"

# ─── Required Environment Variables ─────────────────────────────────────────
# Set production values in Netlify → Site configuration → Environment variables.
# Never commit secret values.
#
# Core authentication / database:
#   DATABASE_URL          Neon PostgreSQL application connection string
#   AUTH_URL              https://www.edumeetup.com
#   AUTH_SECRET           Stable NextAuth v5 production secret
#   AUTH_GOOGLE_ID        Google OAuth client ID
#   AUTH_GOOGLE_SECRET    Google OAuth client secret
#   NEXT_PUBLIC_APP_URL   https://www.edumeetup.com
#
# Email / operations:
#   EMAIL_FROM
#   RESEND_API_KEY
#   SUPPORT_EMAIL
#   NEXT_PUBLIC_SUPPORT_EMAIL
#   ADMIN_NOTIFICATION_EMAIL
#
# Storage:
#   R2_ACCOUNT_ID
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET
#   R2_PUBLIC_URL
#
# AI / monitoring (when the corresponding feature is enabled):
#   ANTHROPIC_API_KEY
#   NEXT_PUBLIC_SENTRY_DSN
#   NEXT_PUBLIC_APP_ENV   production
#   SENTRY_AUTH_TOKEN
#
# HTTP cron/API routes:
#   CRON_SECRET           Shared secret for routes that explicitly authenticate it.
#                         Native Netlify Scheduled Functions are platform-triggered
#                         and MUST NOT require a custom x-cron-secret header.
#
# Database migrations:
#   DIRECT_URL            Neon direct/non-pooled connection string. Production
#                         migrations run in .github/workflows/migrate.yml; they do
#                         not run as part of this Netlify build command.
#
# WhatsApp (when activated):
#   WHATSAPP_TOKEN
#   WHATSAPP_PHONE_ID

# --- Security Headers ---------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.clare.ai https://*.wati.io https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://fonts.googleapis.com https://o4508786857902080.ingest.sentry.io; frame-src 'none'; object-src 'none';"
