name: Deploy Database Migrations

# 1. The Trigger: Wake up only when code is pushed to the 'main' branch
on:
  push:
    branches:
      - main
  workflow_dispatch: # re-run by hand after a failure, e.g. a Neon outage

# Never run two migrations against the same database at once
# (two quick merges to main used to start overlapping runs).
concurrency:
  group: prisma-migrate-production
  cancel-in-progress: false

# Deliberately NOT gated on CI: Netlify deploys main as soon as it is pushed,
# and migrations (~40 s) must land before the new code (~2 min build) goes
# live. Waiting for CI would put the code ahead of the schema. Keep CI green
# by requiring it on pull requests instead (branch protection on main).

# 2. What the robot does
jobs:
  migrate-database:
    name: Run Prisma Migrate Deploy
    runs-on: ubuntu-latest # Borrow a fresh Linux server from GitHub
    
    steps:
      - name: 📥 Download your code
        uses: actions/checkout@v4

      - name: ⚙️ Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install project dependencies
        run: npm ci # Faster and safer than npm install for automated robots

      - name: 🚀 Run Database Migration (via Prisma)
        env:
          # We use the DIRECT_URL for both because migrations require the direct connection.
          # You only need to add ONE secret in GitHub!
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy
