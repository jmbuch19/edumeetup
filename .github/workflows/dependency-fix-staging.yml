name: Dependency Fix Staging

on:
  push:
    branches: ['codex/dependency-fix-staging']

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: codex/dependency-fix-staging

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking npm security fixes
        run: npm audit fix

      - name: Generate Prisma client
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Report production audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Commit generated dependency files
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No package changes generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Apply non-breaking npm security fixes"
          git push origin HEAD:codex/dependency-fix-staging
