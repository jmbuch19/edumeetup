name: Dependency migration staging

on:
  push:
    branches:
      - codex/pwa-next-staging

permissions:
  contents: write

jobs:
  final-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pwa-next-staging

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install validated migration tree
        run: npm ci

      - name: Add required Tailwind animation plugin
        run: npm install tailwindcss-animate

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: staging-build-secret-not-for-production
          AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build

      - name: Commit validated dependency
        shell: bash
        run: |
          git config user.name "jmbuch19"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Stage Tailwind animation dependency [skip ci]"
            git push origin HEAD:codex/pwa-next-staging
          fi
