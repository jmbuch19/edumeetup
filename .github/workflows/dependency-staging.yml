name: Dependency migration staging

on:
  push:
    branches:
      - codex/pwa-next-staging

permissions:
  contents: write

jobs:
  next-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pwa-next-staging

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install validated PWA-retired tree
        run: npm ci

      - name: Upgrade Next.js to patched major
        shell: bash
        run: |
          npm install next@16.3.4 eslint-config-next@16.3.4
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['build'] = 'prisma generate --schema=./prisma/schema.prisma && next build'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          config_path = Path('next.config.mjs')
          config = config_path.read_text()
          config = config.replace('import { withSentryConfig } from "@sentry/nextjs";', 'import { withSentryConfig } from "@sentry/nextjs/config";')
          config = config.replace("    eslint: {\n        ignoreDuringBuilds: true,\n    },\n", '')
          config_path.write_text(config)
          PY

      - name: Production dependency audit
        run: npm audit --omit=dev || true

      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: staging-build-secret-not-for-production
          AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build

      - name: Commit validated Next.js migration
        shell: bash
        run: |
          git config user.name "jmbuch19"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json next.config.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Stage patched Next.js migration [skip ci]"
            git push origin HEAD:codex/pwa-next-staging
          fi
